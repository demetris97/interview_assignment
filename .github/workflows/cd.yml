name: Python CD

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          mkdir -p deployed
          cp scripts/calculator.py deployed/
          echo "Application deployed successfully!"

      - name: Show deployed files
        run: |
          ls -la deployed